<rect x="420" y="156" width="290" height="36" fill="#d6d3d1"/>

<text x="780" y="222" font-size="12" fill="#78716c" text-anchor="end">χρόνος →</text>
<text x="40" y="246" font-size="12" fill="#78716c">Ένα νέο πεδίο στη βάση σημειώνει ποιες διορθώσεις πέφτουν πάνω σε τέτοια σημεία.</text>
</svg>
