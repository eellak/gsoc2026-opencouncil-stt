<line x1="530" y1="58" x2="530" y2="198" stroke="#ff6600" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="475" y="46" font-size="13" font-weight="700" fill="#ff6600" text-anchor="middle">επικάλυψη: μιλούν και οι δύο</text>

<text x="40" y="99" font-size="14" fill="#0c0a09">Ομιλητής Α</text>
