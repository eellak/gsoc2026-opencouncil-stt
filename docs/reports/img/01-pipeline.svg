<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter,'Relative Book Pro',system-ui,sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<rect x="0" y="0" width="6" height="400" fill="#ff6600"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
</marker>
<marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#ff6600"/>
</marker>
</defs>

<text x="40" y="40" font-size="12" fill="#78716c">πώς βγαίνει σήμερα μια μεταγραφή</text>

<rect x="40" y="54" width="190" height="60" fill="#f5f5f4" stroke="#d6d3d1"/>
<text x="135" y="80" font-size="14" font-weight="700" fill="#0c0a09" text-anchor="middle">Ήχος συνεδρίασης</text>
<text x="135" y="99" font-size="11" fill="#78716c" text-anchor="middle">η αίθουσα, με τον θόρυβό της</text>

<line x1="230" y1="84" x2="248" y2="84" stroke="#78716c" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="250" y="54" width="190" height="60" fill="#f5f5f4" stroke="#d6d3d1"/>
<text x="345" y="80" font-size="14" font-weight="700" fill="#0c0a09" text-anchor="middle">Μοντέλο ASR</text>
<text x="345" y="99" font-size="11" fill="#78716c" text-anchor="middle">πρώτη μεταγραφή</text>

<line x1="440" y1="84" x2="458" y2="84" stroke="#78716c" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="460" y="54" width="190" height="60" fill="#f5f5f4" stroke="#d6d3d1"/>
<text x="555" y="80" font-size="14" font-weight="700" fill="#0c0a09" text-anchor="middle">LLM</text>
<text x="555" y="99" font-size="11" fill="#78716c" text-anchor="middle">καθάρισμα κειμένου</text>

<line x1="650" y1="84" x2="668" y2="84" stroke="#78716c" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="670" y="54" width="190" height="60" fill="#f5f5f4" stroke="#d6d3d1"/>
<text x="765" y="80" font-size="14" font-weight="700" fill="#0c0a09" text-anchor="middle">Άνθρωπος</text>
<text x="765" y="99" font-size="11" fill="#78716c" text-anchor="middle">τελικές διορθώσεις</text>

<line x1="765" y1="114" x2="765" y2="212" stroke="#ff6600" stroke-width="1.5" marker-end="url(#arrOrange)"/>
<text x="755" y="168" font-size="11" fill="#ff6600" text-anchor="end">κάθε αλλαγή κρατιέται</text>

<text x="40" y="200" font-size="12" fill="#78716c">αυτό το project</text>

<rect x="670" y="214" width="190" height="60" fill="#fff7ed" stroke="#ff6600"/>
<text x="765" y="240" font-size="14" font-weight="700" fill="#0c0a09" text-anchor="middle">Αρχείο διορθώσεων</text>
<text x="765" y="259" font-size="11" fill="#78716c" text-anchor="middle">εκατοντάδες χιλιάδες</text>

<line x1="670" y1="244" x2="652" y2="244" stroke="#ff6600" stroke-width="1.5" marker-end="url(#arrOrange)"/>

<rect x="460" y="214" width="190" height="60" fill="#fff7ed" stroke="#ff6600"/>
<text x="555" y="240" font-size="14" font-weight="700" fill="#0c0a09" text-anchor="middle">Review</text>
<text x="555" y="259" font-size="11" fill="#78716c" text-anchor="middle">διαλέγουμε τις χρήσιμες</text>

<line x1="460" y1="244" x2="442" y2="244" stroke="#ff6600" stroke-width="1.5" marker-end="url(#arrOrange)"/>

<rect x="250" y="214" width="190" height="60" fill="#fff7ed" stroke="#ff6600"/>
<text x="345" y="240" font-size="14" font-weight="700" fill="#0c0a09" text-anchor="middle">Dataset</text>
<text x="345" y="259" font-size="11" fill="#78716c" text-anchor="middle">ζευγάρια ήχου–κειμένου</text>

<line x1="250" y1="244" x2="232" y2="244" stroke="#ff6600" stroke-width="1.5" marker-end="url(#arrOrange)"/>

<rect x="40" y="214" width="190" height="60" fill="#fff7ed" stroke="#ff6600"/>
<text x="135" y="240" font-size="14" font-weight="700" fill="#0c0a09" text-anchor="middle">Fine-tune</text>
<text x="135" y="259" font-size="11" fill="#78716c" text-anchor="middle">εκπαίδευση του Whisper</text>

<polyline points="135,214 135,160 345,160 345,118" fill="none" stroke="#ff6600" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrOrange)"/>
<text x="150" y="152" font-size="11" fill="#ff6600">το βελτιωμένο μοντέλο ξαναμπαίνει</text>
<text x="360" y="152" font-size="11" fill="#ff6600">στην αρχή</text>

<text x="880" y="330" font-size="12" fill="#78716c" text-anchor="end">όσο καλύτερο το μοντέλο, τόσο λιγότερα διορθώνει ο άνθρωπος</text>
</svg>
