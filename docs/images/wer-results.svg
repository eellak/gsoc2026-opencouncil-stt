<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="860" height="400" fill="#ffffff"/>
<text x="24" y="32" font-size="17" font-weight="700" fill="#1f2328">Greek municipal council speech: word error rate</text>
<text x="24" y="52" font-size="12.5" fill="#57606a">391 held-out windows, 117 meetings, none of them in any training data. Lower is better.</text>
<text x="310" y="92" font-size="12.5" text-anchor="end" fill="#1f2328">Several systems combined (an idea to test)</text>
<rect x="320" y="74" width="245.9" height="26" fill="#8250df" rx="3"/>
<text x="573.9" y="92" font-size="12.5" font-weight="600" fill="#1f2328">0.1202</text>
<text x="310" y="130" font-size="12.5" text-anchor="end" fill="#1f2328">ElevenLabs Scribe v2</text>
<rect x="320" y="112" width="281.7" height="26" fill="#57606a" rx="3"/>
<text x="609.7" y="130" font-size="12.5" font-weight="600" fill="#1f2328">0.1377</text>
<text x="310" y="168" font-size="12.5" text-anchor="end" fill="#1f2328">Soniox</text>
<rect x="320" y="150" width="297.6" height="26" fill="#57606a" rx="3"/>
<text x="625.6" y="168" font-size="12.5" font-weight="600" fill="#1f2328">0.1455</text>
<text x="310" y="206" font-size="12.5" text-anchor="end" fill="#1f2328">Our adapter, v2</text>
<rect x="320" y="188" width="367.2" height="26" fill="#1a7f37" rx="3"/>
<text x="695.2" y="206" font-size="12.5" font-weight="600" fill="#1f2328">0.1795</text>
<text x="310" y="244" font-size="12.5" text-anchor="end" fill="#1f2328">Our adapter, v1</text>
<rect x="320" y="226" width="381.9" height="26" fill="#2da44e" rx="3"/>
<text x="709.9" y="244" font-size="12.5" font-weight="600" fill="#1f2328">0.1867</text>
<text x="310" y="282" font-size="12.5" text-anchor="end" fill="#1f2328">gpt-4o-transcribe</text>
<rect x="320" y="264" width="396.2" height="26" fill="#57606a" rx="3"/>
<text x="724.2" y="282" font-size="12.5" font-weight="600" fill="#1f2328">0.1937</text>
<text x="310" y="320" font-size="12.5" text-anchor="end" fill="#1f2328">whisper-large-v3, not fine-tuned</text>
<rect x="320" y="302" width="406.6" height="26" fill="#0969da" rx="3"/>
<text x="734.6" y="320" font-size="12.5" font-weight="600" fill="#1f2328">0.1988</text>
<text x="310" y="358" font-size="12.5" text-anchor="end" fill="#1f2328">Gladia, the baseline we started from</text>
<rect x="320" y="340" width="426.5" height="26" fill="#57606a" rx="3"/>
<text x="754.5" y="358" font-size="12.5" font-weight="600" fill="#1f2328">0.2085</text>
<line x1="320" y1="68" x2="320" y2="384" stroke="#d0d7de"/>
<text x="24" y="410" font-size="12" fill="#1a7f37" font-weight="600">Fine-tuning moved whisper-large-v3 from 0.1988 to 0.1795, and v2 drops 40% fewer words than v1.</text>
<text x="24" y="428" font-size="11.5" fill="#57606a">Neither version reaches the commercial systems. Metric: agreement with OpenCouncil transcripts, one decoder stack for all rows.</text>
</svg>